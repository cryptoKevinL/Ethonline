<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbox Breakout Test Suite (Auto)</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { color: #fff; border-bottom: 1px solid #00ff00; padding-bottom: 10px; }
        .test-section {
            background: #2a2a2a;
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #444;
        }
        button {
            background: #005500;
            color: #fff;
            border: 1px solid #00ff00;
            cursor: pointer;
            padding: 5px 10px;
            margin: 5px;
            font-family: monospace;
        }
        button:hover { background: #00aa00; }
        #logs {
            background: #000;
            padding: 10px;
            height: 350px;
            overflow-y: auto;
            border: 1px solid #444;
            white-space: pre-wrap;
        }
        .success { color: #00ff00; }
        .error { color: #ff0000; }
        .info { color: #ffff00; }
        .warn { color: #ffaa00; }
    </style>
</head>
<body>
    <h1>Sandbox Breakout Test Suite (Auto-Run)</h1>
    <div id="logs">Waiting for page load...</div>

    <div class="test-section">
        <h3>Test Results</h3>
        <p>Tests will execute automatically upon load.</p>
    </div>

    <script>
        const logs = document.getElementById('logs');

        function log(message, type = 'info') {
            const line = document.createElement('div');
            line.className = type;
            line.textContent = `> ${message}`;
            logs.appendChild(line);
            logs.scrollTop = logs.scrollHeight;
        }

        function testUserAgent() {
            log(`Navigator.userAgent: ${navigator.userAgent}`, 'info');
            const ua = navigator.userAgent.toLowerCase();
            if (ua.includes('playwright')) log('Platform appears to be Playwright.', 'success');
            if (ua.includes('headless')) log('Headless browser detected.', 'success');
        }

        async function testLocalhost(url) {
            log(`Attempting fetch to ${url}...`, 'info');
            try {
                const response = await fetch(url, { mode: 'no-cors' });
                log(`Connection to ${url} succeeded (Status: ${response.status || 'CORS Preflight OK'})`, 'success');
            } catch (error) {
                log(`Connection to ${url} failed: ${error.message}`, 'error');
            }
        }

        async function testOriginSpoofing(method = 'GET') {
            const targetUrl = 'http://localhost:8082/mcp'; 
            log(`Attempting ${method} request to ${targetUrl} with Origin: http://paystream.cc`, 'warn');

            const options = {
                method: method,
                headers: {
                    'Origin': 'http://paystream.cc',
                    'Content-Type': 'application/json'
                }
            };

            if (method === 'POST') {
                options.body = JSON.stringify({
                    jsonrpc: "2.0",
                    id: 1,
                    method: "tools/list"
                });
            }

            try {
                const response = await fetch(targetUrl, options);
                log(`Request sent. Status: ${response.status}`, 'info');
                log(`Response Headers: ${JSON.stringify(Array.from(response.headers.entries()))}`, 'info');
                log(`Response Body: ${response.status === 200 ? 'Success (Check MCP logs for Origin validation)' : 'Failed'}`, 'success');
            } catch (error) {
                log(`Request failed: ${error.message}`, 'error');
            }
        }

        async function scanPorts() {
            const ports = [5432, 6379, 8888, 9000, 9090, 9091];
            log(`Starting port scan...`, 'info');
            for (const port of ports) {
                await testLocalhost(`http://127.0.0.1:${port}/`);
            }
        }

        function testDOM() {
            log(`Document URL: ${window.location.href}`, 'info');
            log(`LocalStorage Keys: ${JSON.stringify(Object.keys(localStorage))}`, 'info');
            log(`SessionStorage Keys: ${JSON.stringify(Object.keys(sessionStorage))}`, 'info');
            log(`Cookie Count: ${document.cookie ? document.cookie.split(';').length : 0}`, 'info');
            log(`Window Hostname: ${window.location.hostname}`, 'info');
        }

        function testEval() {
            try {
                const result = eval("2 + 2");
                log(`eval() executed successfully: 2 + 2 = ${result}`, 'success');
            } catch (error) {
                log(`eval() failed: ${error.message}`, 'error');
            }
        }

        // AUTO-TRIGGER ALL TESTS
        window.addEventListener('load', async () => {
            log("=== AUTO-TEST SUITE INITIATED ===", 'info');
            await testUserAgent();
            await testLocalhost('http://localhost:8082');
            await testLocalhost('http://localhost:8931');
            await testOriginSpoofing();
            await scanPorts();
            testDOM();
            testEval();
            log("=== TEST SUITE COMPLETE ===", 'info');
        });
    </script>
</body>
</html>
